[project]
name = "keyword-spotting-tensorflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Capped below 3.13 (not just <3.14): uv resolves a universal lock across the
# whole requires-python range, and on 3.13 onnxscript>=0.7's own deps require
# numpy>=2.1.0 while tensorflow==2.18.1 requires numpy<2.1.0 -- a real
# conflict, but only on 3.13; this project runs on 3.12 (see .python-version).
dependencies = [
    "tensorflow==2.18.1",
    "numpy",
    "tqdm",
    # Deliberately NOT depending on tensorflow-metal: verified it produces
    # numerically wrong gradients for this model (see train_tf.py's
    # set_visible_devices([], "GPU") comment) -- training is CPU-only for now.
]

[project.optional-dependencies]
# PyTorch -> ONNX pipeline (train.py, convert_to_onnx.py, run_onnx_mac.py).
# Install with: uv sync --extra torch
torch = [
    "torch",
    "torchaudio",
    "onnx",
    "onnxruntime",
    # >=0.7 required: older onnxscript pulls in an onnx_ir release that's
    # missing onnx_ir.schemas, which torch.onnx.export's exporter needs --
    # confirmed AttributeError: module 'onnx_ir' has no attribute 'schemas'
    # with onnxscript 0.5.0 (onnx_ir 0.1.8); 0.7.1 (onnx_ir 1.0.0) works.
    "onnxscript>=0.7",
]
